# Supports:
# - Open Source: LLaMA, Qwen, MiniCPM, ChatGLM
# - Closed Source: ChatGPT, DeepSeek, LocalServer
model:
  category: "Qwen"
  model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  api_key: "" # API key not needed for huggingface models
  base_url: "" # Base URL not needed for huggingface models

extraction:
  update_case: false # Controls whether to update the case repository with new extraction results.
  show_trajectory: false # Controls whether to display the intermediate steps of extraction when finished.

construct: # If you want to construct a Knowledge Graph, otherwise you can comment this part out.
  database: Neo4j # database type, now only support Neo4j.
  url: neo4j://localhost:7687 # your database URL，Neo4j's default port is 7687.
  username: your_username # your database username.
  password: your_password # your database password.